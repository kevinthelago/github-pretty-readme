# Auth model (#60): this workflow runs its OWN server instance in-process and
# calls it over localhost, authenticating to GitHub through the GH_PAT secret
# exposed as GITHUB_TOKEN. It never copies a session cookie. Automation that
# instead targets a *remote/hosted* instance must authenticate with a minted,
# revocable API token via `Authorization: Bearer ${{ secrets.PRETTY_README_TOKEN }}`
# (see the README "Automate your profile" section) — not a session cookie.
name: Scheduled tasks

on:
  schedule:
    - cron: '0 5 * * *'      # 05:00 UTC daily  — improve topics/descriptions + profile update
    - cron: '0 * * * 1-5'    # every hour Mon-Fri — profile summary refresh
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without applying them'
        type: boolean
        default: false

jobs:
  # ── Daily: improve repo metadata + update profile ────────────────────────────
  improve:
    name: Improve repos + update profile
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - run: npm install

      - name: Start server
        env:
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
          AI_PROMPT:            ${{ secrets.AI_PROMPT }}
          GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
          port: 8080
        run: node express.js > /tmp/server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf "http://localhost:8080/developer-rating" > /dev/null && echo "Server ready" && break
            sleep 2
          done
          curl -sf "http://localhost:8080/developer-rating" > /dev/null || (echo "=== Server log ===" && cat /tmp/server.log && exit 1)

      - name: Grade (before)
        run: |
          echo "=== Rating before improvement ==="
          curl -s "http://localhost:8080/developer-rating-insights" | head -20

      - name: Improve topics
        run: |
          DRY=${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          echo "=== Improving topics (dry_run=$DRY) ==="
          curl -s "http://localhost:8080/improve-topics?dry_run=$DRY" | \
            node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); const j=JSON.parse(d); console.log(\`Checked: \${j.repos_checked} | Updated: \${j.repos_updated} | Errors: \${j.errors}\`); j.updated?.forEach(r => console.log(\`  ✓ \${r.repo}: \${r.topics?.join(', ')}\`)); j.errors_detail?.forEach(e => console.log(\`  ✗ \${e.repo}: \${e.error}\`));"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Improve descriptions
        run: |
          DRY=${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          echo "=== Improving descriptions (dry_run=$DRY) ==="
          curl -s "http://localhost:8080/improve-descriptions?dry_run=$DRY" | \
            node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); const j=JSON.parse(d); console.log(\`Checked: \${j.repos_checked} | Updated: \${j.repos_updated} | Errors: \${j.errors}\`); j.updated?.forEach(r => console.log(\`  ✓ \${r.repo}: \${r.description}\`)); j.errors_detail?.forEach(e => console.log(\`  ✗ \${e.repo}: \${e.error}\`));"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Grade (after) and update profile
        env:
          PROFILE_REPO_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
          port: 8080
        run: |
          echo "=== Rating after improvement ==="
          curl -s "http://localhost:8080/developer-rating-insights" | head -20
          echo ""
          echo "=== Updating profile README ==="
          node scripts/update-profile.mjs kevinthelago

  # ── Hourly (Mon-Fri): refresh profile summary ─────────────────────────────────
  profile:
    name: Refresh profile summary
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * 1-5'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - run: npm install

      - name: Start server
        env:
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
          AI_PROMPT:            ${{ secrets.AI_PROMPT }}
          GITHUB_TOKEN:         ${{ secrets.GH_PAT }}
          port: 8080
        run: node express.js > /tmp/server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf "http://localhost:8080/account-summary?username=kevinthelago" > /dev/null && echo "Server ready" && break
            sleep 2
          done
          echo "=== Server log ==="
          cat /tmp/server.log || true
          curl -sf "http://localhost:8080/account-summary?username=kevinthelago" > /dev/null || (echo "Server never started" && exit 1)

      - name: Update profile README
        env:
          PROFILE_REPO_TOKEN:  ${{ secrets.PROFILE_REPO_TOKEN }}
          MONKEYTYPE_API_KEY:  ${{ secrets.MONKEYTYPE_API_KEY }}
          MONKEYTYPE_USERNAME: ${{ secrets.MONKEYTYPE_USERNAME }}
          port: 8080
        run: node scripts/update-profile.mjs kevinthelago
