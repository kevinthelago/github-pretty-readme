name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGION:  ${{ vars.GCP_REGION }}
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  IMAGE:   ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/github-pretty-readme/app

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm install

      - name: Run smoke tests
        run: npm test

  # ── Build & Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # reserved for future Workload Identity migration

    steps:
      - uses: actions/checkout@v4

      # Authenticate with GCP using a service account key.
      # To migrate to keyless Workload Identity Federation later, replace this
      # step with google-github-actions/auth using workload_identity_provider.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: github-pretty-readme
          region:  ${{ env.REGION }}
          image:   ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            MONKEYTYPE_USERNAME=${{ secrets.MONKEYTYPE_USERNAME }}
          secrets: |
            GITHUB_TOKEN=GH_PAT:latest
            GOOGLE_AI_STUDIO_KEY=GOOGLE_AI_STUDIO_KEY:latest
            MONKEYTYPE_API_KEY=MONKEYTYPE_API_KEY:latest
