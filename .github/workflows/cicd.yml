name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  # ── Build & Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # reserved for future Workload Identity migration

    steps:
      - uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          missing=()
          [ -z "$GCP_REGION" ]     && missing+=("GCP_REGION (repository variable)")
          [ -z "$GCP_PROJECT_ID" ] && missing+=("GCP_PROJECT_ID (repository variable)")
          [ -z "$GCP_SA_KEY" ]     && missing+=("GCP_SA_KEY (repository secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing required configuration:"
            for m in "${missing[@]}"; do echo "   - $m"; done
            echo ""
            echo "Add these in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ All required variables present"
        env:
          GCP_REGION:     ${{ vars.GCP_REGION }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_SA_KEY:     ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          REGION="${{ vars.GCP_REGION }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Enable required GCP APIs
        run: |
          gcloud services enable \
            secretmanager.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            --project="${{ vars.GCP_PROJECT_ID }}" --quiet
          echo "✓ APIs enabled"

      - name: Ensure Artifact Registry repository exists
        env:
          REGION:  ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud artifacts repositories describe github-pretty-readme \
            --location="${REGION}" --project="${PROJECT}" --quiet 2>/dev/null \
          || gcloud artifacts repositories create github-pretty-readme \
            --repository-format=docker \
            --location="${REGION}" \
            --project="${PROJECT}" \
            --description="Docker images for github-pretty-readme" \
            --quiet
          echo "✓ Artifact Registry repository ready"

      - name: Build and push image
        env:
          REGION:  ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/github-pretty-readme/app"
          docker build \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: github-pretty-readme
          region:  ${{ vars.GCP_REGION }}
          image:   ${{ env.IMAGE }}:${{ github.sha }}
          flags:   --allow-unauthenticated
          env_vars: |
            BASE_URL=https://github-pretty-readme-357245595112.us-central1.run.app
            NODE_ENV=production
          secrets: |
            GITHUB_TOKEN=GH_PAT:latest
            GOOGLE_AI_STUDIO_KEY=GOOGLE_AI_STUDIO_KEY:latest
            GITHUB_APP_CLIENT_ID=GITHUB_APP_CLIENT_ID:latest
            GITHUB_APP_CLIENT_SECRET=GITHUB_APP_CLIENT_SECRET:latest
            SESSION_SECRET=SESSION_SECRET:latest
